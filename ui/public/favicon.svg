<?xml version="1.0" encoding="UTF-8"?>
<!--
  KALIMA favicon.

  Replaces the Vite starter bolt, which was purple and had nothing to do with
  the product.

  A favicon cannot respond to a theme, so this uses the LIGHT variant. That is
  the right trade: browsers render the tab strip on light chrome far more often,
  and the light mark still reads on a dark tab bar because the page rectangle is
  cream and the panel is mid blue, both of which hold up against #1a1a1a.

  Simplified from brand/kalima-mark-light.svg: the nine glyph rows collapse to
  five bars and the outline thickens, because at 16px the original detail turns
  to mush. The proportions are unchanged.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g transform="rotate(-7 256 256)">
    <rect x="88" y="104" width="216" height="300" rx="24"
          fill="#F1E6B6" stroke="#4C7C92" stroke-width="12"/>
    <g fill="#4C7C92" opacity="0.85">
      <rect x="114" y="146" width="164" height="20" rx="10"/>
      <rect x="114" y="186" width="140" height="20" rx="10"/>
      <rect x="114" y="226" width="168" height="20" rx="10"/>
      <rect x="114" y="266" width="126" height="20" rx="10"/>
      <rect x="114" y="306" width="158" height="20" rx="10"/>
    </g>
  </g>

  <path fill="#B3A054" d="
    M 214 316 C 246 292, 268 268, 286 244
    L 300 258 L 356 246 L 330 200 L 316 214 L 330 228
    C 302 258, 272 292, 236 332 Z"/>

  <rect x="318" y="126" width="150" height="272" rx="26"
        fill="#4C7C92" stroke="#F1E6B6" stroke-width="12"/>
  <g fill="#F1E6B6">
    <rect x="342" y="162" width="102" height="20" rx="10"/>
    <rect x="342" y="200" width="86" height="20" rx="10"/>
    <rect x="342" y="238" width="102" height="20" rx="10"/>
  </g>
  <g fill="#4C7C92" stroke="#F1E6B6" stroke-width="7">
    <rect x="342" y="292" width="30" height="26" rx="6"/>
    <rect x="380" y="292" width="30" height="26" rx="6"/>
    <rect x="418" y="292" width="30" height="26" rx="6"/>
    <rect x="342" y="326" width="30" height="26" rx="6"/>
    <rect x="380" y="326" width="30" height="26" rx="6"/>
    <rect x="418" y="326" width="30" height="26" rx="6"/>
    <rect x="342" y="360" width="30" height="26" rx="6"/>
    <rect x="380" y="360" width="30" height="26" rx="6"/>
    <rect x="418" y="360" width="30" height="26" rx="6"/>
  </g>
</svg>
